<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#151D30" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00E5FF" flood-opacity="0.6" />
    </filter>
    <filter id="coralGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FF553E" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer Rounded Tile -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.16)" stroke-width="4" />

  <!-- Tic-Tac-Toe Grid Lines -->
  <line x1="48" y1="22" x2="48" y2="106" stroke="rgba(255,255,255,0.14)" stroke-width="4.5" stroke-linecap="round" />
  <line x1="80" y1="22" x2="80" y2="106" stroke="rgba(255,255,255,0.14)" stroke-width="4.5" stroke-linecap="round" />
  <line x1="22" y1="48" x2="106" y2="48" stroke="rgba(255,255,255,0.14)" stroke-width="4.5" stroke-linecap="round" />
  <line x1="22" y1="80" x2="106" y2="80" stroke="rgba(255,255,255,0.14)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Top-Left X (Electric Cyan) -->
  <g filter="url(#cyanGlow)">
    <path d="M26 26L40 40M40 26L26 40" stroke="#00E5FF" stroke-width="6.5" stroke-linecap="round" />
  </g>

  <!-- Center X (Electric Cyan) -->
  <g filter="url(#cyanGlow)">
    <path d="M57 57L71 71M71 57L57 71" stroke="#00E5FF" stroke-width="6.5" stroke-linecap="round" />
  </g>

  <!-- Bottom-Right X (Electric Cyan) -->
  <g filter="url(#cyanGlow)">
    <path d="M88 88L102 102M102 88L88 102" stroke="#00E5FF" stroke-width="6.5" stroke-linecap="round" />
  </g>

  <!-- Top-Right O (Arcade Coral) -->
  <g filter="url(#coralGlow)">
    <circle cx="95" cy="33" r="8" stroke="#FF553E" stroke-width="6" />
  </g>

  <!-- Bottom-Left O (Arcade Coral) -->
  <g filter="url(#coralGlow)">
    <circle cx="33" cy="95" r="8" stroke="#FF553E" stroke-width="6" />
  </g>

  <!-- Winning Diagonal Strike Line (Solar Gold) -->
  <line x1="22" y1="22" x2="106" y2="106" stroke="#FFB800" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 0" opacity="0.9" />
</svg>

